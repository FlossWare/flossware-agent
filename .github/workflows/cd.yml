name: CD-CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
       github.event.pusher.email != 'version-bump@flossware.org')
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Preparing settings.xml
        uses: s4u/maven-settings-action@v3.1.0
        with:
          githubServer: false
          servers: |
            [
              {
                "id": "packagecloud-flossware",
                "configuration": {
                  "httpHeaders": {
                    "property": {
                      "name": "Authorization",
                      "value": "Bearer ${{ secrets.PACKAGECLOUD_TOKEN }}"
                    }
                  }
                }
              }
            ]

      - name: Setup git credentials for tag
        uses: oleksiyrudenko/gha-git-credentials@latest
        with:
          global: true
          name: Version Bump
          email: version-bump@flossware.org
          actor: VersionBump
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and test
        run: mvn -U clean verify

      - name: Verify artifact
        run: |
          if ! ls target/flossware-agent-*.jar >/dev/null 2>&1; then
            echo "Build failed - artifact not found"
            exit 1
          fi
          echo "Built: $(ls target/flossware-agent-*.jar)"

      - name: Deploy to PackageCloud
        run: mvn -DskipTests deploy

      # First release publishes the POM version as-is (1.0).
      # Subsequent minor bumps can use versions-maven-plugin in a follow-up.
      - name: Tag release
        run: |
          VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists"
          else
            git tag -a "$VERSION" -m "Release $VERSION"
            git push origin "$VERSION"
          fi
